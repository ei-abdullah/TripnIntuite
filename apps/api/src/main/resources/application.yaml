google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

liteapi:
  key: ${LiteAPI_API_KEY}
  base-url: https://api.liteapi.travel
  book-base-url: https://book.liteapi.travel

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SUPPORT_EMAIL}
    password: ${APP_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jackson:
    default-property-inclusion: non_null

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-opus-4-7
        max-tokens: 4096

logging:
  level:
    com.abdullah.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: INFO

server:
  # Honor X-Forwarded-Proto/Host from DigitalOcean's proxy so URLs built from
  # the request (ServletUriComponentsBuilder) use the public https host, not the
  # internal http://…:8080.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-stacktrace: always